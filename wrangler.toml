name = "api-workers"
main = "src/worker.ts"
compatibility_date = "2024-01-01"

# ============= VARS (não sensíveis) =============
[vars]
EMAIL_FROM = "Financeiro Share Brasil <financeiro@share-brasil.com>"

# ============= KV NAMESPACE =============
[[kv_namespaces]]
binding = "CACHE_KV"
id = "83a861dc2e27486e86eb23909fbb9861"

# ============= OBSERVABILITY =============
[observability]
enabled = true

# ── R2 para armazenar PDFs, boletos, NFs, comprovantes ──────────────────────
[[r2_buckets]]
binding = "FILES"
bucket_name = "nf-boletos-clients"

# ── D1 para templates de email, log de envios, short links e mensageria ────
[[d1_databases]]
binding = "DB"
database_name = "share-brasil-aux"
database_id = "b7048c06-cc46-4832-bac5-641a24ce245c"

# ── D1 principal do Portal Cliente e das reservas de voo ────────────────────
[[d1_databases]]
binding = "SHARE_DB"
database_name = "bd_sharebrasil"
database_id = "4267a49f-e38f-442f-8b6f-47fe02dea308"

# ── Secrets (NÃO colocar valores aqui — usar `wrangler secret put <NOME>`) ──
# AISWEB_API_KEY
# AISWEB_API_PASS
# RESEND_API_KEY
# ANTHROPIC_API_KEY
# INTERNAL_TOKEN
# GROQ_API_KEY
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# TELEGRAM_BOT_TOKEN
# WINSOCK_VALUATION_URL
# WINSOCK_API_KEY
# WINSOCK_AUTH_HEADER (opcional; padrão no código: X-API-Key)
# WINSOCK_AUTH_PREFIX (opcional; padrão no código: '' — sem prefixo)

# ── Cron para pré-aquecer cache (weather/notam/nearest) ─────────────────────
[triggers]
crons = ["*/15 * * * *"]
