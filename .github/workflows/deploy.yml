name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: Type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'))
    needs: check
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply portal session migration
        run: pnpm exec wrangler d1 execute bd_sharebrasil --remote --yes --file=migrations/20261024_portal_sessoes_revogadas.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Remove misplaced supplier columns from receipts
        run: |
          if pnpm exec wrangler d1 execute bd_sharebrasil --remote --command "SELECT fornecedor_id, fornecedor_nome FROM recibos LIMIT 0" >/dev/null 2>&1; then
            pnpm exec wrangler d1 execute bd_sharebrasil --remote --yes --command "UPDATE lancamentos SET fornecedores_favoritos_id = COALESCE(fornecedores_favoritos_id, (SELECT r.fornecedor_id FROM recibos r WHERE r.lancamento_id = lancamentos.id LIMIT 1)), fornecedor_nome = COALESCE(fornecedor_nome, (SELECT r.fornecedor_nome FROM recibos r WHERE r.lancamento_id = lancamentos.id LIMIT 1)) WHERE EXISTS (SELECT 1 FROM recibos r WHERE r.lancamento_id = lancamentos.id AND (r.fornecedor_id IS NOT NULL OR r.fornecedor_nome IS NOT NULL))"
          fi
          for column in fornecedor_id fornecedor_nome; do
            if pnpm exec wrangler d1 execute bd_sharebrasil --remote --command "SELECT ${column} FROM recibos LIMIT 0" >/dev/null 2>&1; then
              pnpm exec wrangler d1 execute bd_sharebrasil --remote --yes --command "ALTER TABLE recibos DROP COLUMN ${column}"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
