name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      remover_tabelas_pagamentos:
        description: Remover as duas tabelas antigas após conferir todos os pagamentos no rateio
        type: boolean
        default: false

concurrency:
  group: financeiro-deploy-${{ github.event_name == 'pull_request' && github.ref || 'worker' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: Type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Testes NF de saída e pagamentos da holding com FKs reais
        run: node --import tsx --test tests/nf-saida-holding-pagamento.test.mjs tests/baixa-individual-cotista.test.mjs tests/migrar-baixas-rateio.test.mjs

      - name: Testes do balanço e custos do portal
        run: node --import tsx --test tests/portal-horas-espelho.test.mjs tests/portal-custos-reais.test.mjs tests/portal-balanco-pagador.test.mjs tests/portal-aeronave-dashboard.test.mjs

      - name: Testes Diário de Bordo automático e horas
        run: node --import tsx --test tests/diario-automatico-tripapp.test.mjs tests/horas-tripulante.test.mjs

      - name: Testes planejamento de próximas pernas na mesma solicitação
        run: node --import tsx --test tests/pernas-planejadas.test.mjs

      - name: Testes acompanhamento e GPS do tripulante
        run: node --import tsx --test tests/gps-tripulante.test.mjs tests/rastreio-historico.test.mjs tests/rastreio-d1-compat.test.mjs tests/trip-share-flight-permissions.test.mjs

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'))
    needs: check
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Criar armazenamento GPS do tripulante
        run: pnpm exec wrangler d1 execute bd_sharebrasil --remote --file=migrations/20261122_rastreio_gps_tripulante.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Preparar as baixas nos próprios rateios
        run: node scripts/migrar-baixas-rateio.mjs preparar --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Vincular agendamentos à solicitação original
        run: |
          colunas=$(pnpm exec wrangler d1 execute bd_sharebrasil --remote --json --command="PRAGMA table_info(solicitacoes_reserva_voo)")
          if ! jq -e '.[0].results | any(.name == "solicitacao_origem_id")' <<< "$colunas" > /dev/null; then
            pnpm exec wrangler d1 execute bd_sharebrasil --remote --file=migrations/20261124_agendamento_solicitacao_origem.sql
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Conferir e remover tabelas antigas de pagamentos
        if: github.event_name == 'workflow_dispatch' && inputs.remover_tabelas_pagamentos
        run: node scripts/migrar-baixas-rateio.mjs remover-legado --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
